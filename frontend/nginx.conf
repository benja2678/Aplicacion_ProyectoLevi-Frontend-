# ------------------------------------------------------------------
# Nginx: la "puerta de entrada" del sistema (único puerto abierto: 80).
#
#   /          -> la página web (React ya compilado, carpeta dist/)
#   /api/      -> backend Django (la API: login, alumnos, sesiones, envío de Unity)
#   /admin/    -> backend Django (panel de administración)
#   /static/   -> backend Django (CSS/JS del panel /admin/)
#
# "backend" es el nombre del servicio en docker-compose.yml: Docker lo traduce
# a la dirección interna del contenedor del backend.
# ------------------------------------------------------------------

# Límite de intentos de login por IP (10 por minuto), además del límite de Django.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Tamaño máximo de una petición: las sesiones pueden pesar bastante.
    # Debe coincidir con MAX_UPLOAD_MB de Django (50).
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # Comprime la página y las respuestas JSON de la API (cargan más rápido).
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------------- Backend (Django) ----------------

    # Busca la dirección de "backend" en cada petición (DNS interno de Docker), así
    # Nginx arranca aunque el backend todavía no esté listo y lo encuentra si se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Datos que Django necesita saber de la petición original.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    limit_req_status 429;

    # Las 2 pantallas de login tienen límite de intentos.
    location = /api/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $backend;
    }
    location = /admin/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $backend;
    }

    # proxy_pass sin ruta al final: la dirección llega a Django tal cual, sin
    # decodificar (importante para los id de sesión que llevan ":" codificados).
    location /api/    { proxy_pass $backend; }
    location /admin/  { proxy_pass $backend; }
    location /static/ { proxy_pass $backend; }

    # ---------------- Página web (React) ----------------

    # Archivos con huella en el nombre (index-a1b2c3.js): se pueden guardar en caché
    # por mucho tiempo, porque cada versión nueva tiene otro nombre.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html nunca en caché: así el navegador ve siempre la versión nueva.
    location = /index.html {
        expires -1;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
